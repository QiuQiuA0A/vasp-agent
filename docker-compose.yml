services:
  vasp-agent:
    build: .
    environment:
      - VASP_API_KEY=${VASP_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - VASP_MAX_UPLOAD_MB=${VASP_MAX_UPLOAD_MB:-50}
      - VASP_POTCAR_LIBRARY=/potcar
      - VASP_SLURM_PARTITION=${VASP_SLURM_PARTITION:-compute}
      - VASP_SLURM_NODES=${VASP_SLURM_NODES:-1}
      - VASP_SLURM_NTASKS=${VASP_SLURM_NTASKS:-32}
      - VASP_SLURM_WALLTIME=${VASP_SLURM_WALLTIME:-24:00:00}
      - VASP_SLURM_MODULE=${VASP_SLURM_MODULE:-vasp/6.4.3}
    volumes:
      - ${VASP_POTCAR_HOST:-./potcar_library}:/potcar
      - incar_templates:/app/incar_templates
    restart: unless-stopped
    # Port 8000 is internal only — Caddy is the public front door

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - vasp-agent

volumes:
  incar_templates:
  caddy_data:
  caddy_config:
