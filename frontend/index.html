<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VASP Agent</title>
<link rel="stylesheet" href="style.css">
<script src="https://3Dmol.org/build/3Dmol-min.js"></script>
</head>
<body>
<div class="bg-decoration"></div>
<div class="container">
  <header>
    <h1>VASP Agent</h1>
    <p>自动建模 &amp; VASP 输入文件生成</p>
  </header>

  <main>
    <section class="input-section">
      <div class="form-group">
        <label for="calcType">计算类型</label>
        <select id="calcType">
          <option value="optimization">结构优化 (Optimization)</option>
          <option value="homo_lumo">HOMO-LUMO 计算</option>
          <option value="dipole">偶极矩 (Dipole Moment)</option>
          <option value="aimd">分子动力学 (AIMD)</option>
          <option value="frequency">振动频率 (Frequency)</option>
          <option value="dos">态密度 (DOS)</option>
          <option value="band">能带结构 (Band)</option>
          <option value="work_function">功函数 (Work Function)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="inputFormat">输入格式</label>
        <select id="inputFormat">
          <option value="smiles">SMILES</option>
          <option value="formula">分子式</option>
          <option value="xyz">XYZ</option>
          <option value="cif">CIF</option>
          <option value="mol">MOL</option>
        </select>
      </div>

      <div class="form-group">
        <label for="structureData">结构数据</label>
        <textarea id="structureData" rows="5" placeholder="输入 SMILES、分子式或粘贴文件内容..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="charge">电荷</label>
          <input type="number" id="charge" value="0" min="-5" max="5">
        </div>
        <div class="form-group">
          <label for="multiplicity">自旋多重度</label>
          <input type="number" id="multiplicity" value="1" min="1" max="10">
        </div>
        <div class="form-group">
          <label for="name">分子名称</label>
          <input type="text" id="name" value="molecule" maxlength="100">
        </div>
      </div>

      <details class="advanced-options">
        <summary>高级选项</summary>
        <div class="form-row">
          <div class="form-group">
            <label for="encut">ENCUT (eV)</label>
            <input type="number" id="encut" placeholder="400" min="100" max="1500">
          </div>
          <div class="form-group" id="nswGroup">
            <label for="nsw">NSW (步数)</label>
            <input type="number" id="nsw" placeholder="100" min="0" max="50000">
          </div>
          <div class="form-group" id="tempGroup" style="display:none">
            <label for="temperature">温度 (K)</label>
            <input type="number" id="temperature" placeholder="300" min="0" max="5000">
          </div>
          <div class="form-group">
            <label for="functional">交换关联泛函</label>
            <select id="functional">
              <option value="PBE" selected>PBE</option>
              <option value="LDA">LDA</option>
              <option value="PW91">PW91</option>
            </select>
          </div>
        </div>
      </details>

      <button id="generateBtn">生成 VASP 输入文件</button>
    </section>

    <section id="resultSection" class="result-section" style="display:none;">
      <div class="summary-box" id="summaryBox"></div>

      <div id="structureViewer" class="structure-viewer" style="display:none;">
        <div id="molViewer" style="width:100%;height:300px;position:relative;"></div>
      </div>

      <div class="tabs" id="fileTabs"></div>
      <div class="tab-content" id="tabContent">
        <pre><code id="fileContent"></code></pre>
      </div>

      <div class="result-actions">
        <button id="downloadZipBtn">下载全部文件 (.zip)</button>
        <button id="copyBtn">复制当前内容</button>
      </div>
    </section>

    <hr class="section-divider">
    <h2>金属表面建模 (Beta)</h2>

    <section class="input-section">
      <p class="section-desc">根据金属晶格类型（BCC/FCC/HCP）和 Miller 指数自动构建 Slab 模型，可选吸附分子。生成适用于表面催化计算的 VASP 输入文件。</p>
      <div class="form-row">
        <div class="form-group">
          <label for="surfaceMetal">金属</label>
          <select id="surfaceMetal">
            <option value="Fe" selected>Fe (BCC)</option>
            <option value="Cr">Cr (BCC)</option>
            <option value="Cu">Cu (FCC)</option>
            <option value="Al">Al (FCC)</option>
            <option value="Ni">Ni (FCC)</option>
            <option value="Zn">Zn (HCP)</option>
            <option value="Mg">Mg (HCP)</option>
            <option value="Ti">Ti (HCP)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="surfaceIndex">晶面 (Miller)</label>
          <select id="surfaceIndex">
            <option value="110" selected>110</option>
            <option value="100">100</option>
            <option value="111">111</option>
          </select>
        </div>
        <div class="form-group">
          <label for="surfaceLayers">原子层数</label>
          <input type="number" id="surfaceLayers" value="4" min="1" max="20">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="surfaceVacuum">真空层 (A)</label>
          <input type="number" id="surfaceVacuum" value="15.0" min="5" max="50" step="0.5">
        </div>
        <div class="form-group">
          <label for="surfaceFixBottom">固定底层数</label>
          <input type="number" id="surfaceFixBottom" value="2" min="0" max="10">
        </div>
      </div>
      <div class="form-group">
        <label for="surfaceXyz">吸附分子 XYZ（可选）— 需预先摆好位置</label>
        <textarea id="surfaceXyz" rows="4" placeholder="3
H2O above Fe110
O   1.433  1.013  20.0
H   2.0    1.5    20.5
H   1.0    0.5    20.5"></textarea>
      </div>
      <div class="btn-row">
        <button id="buildSlabBtn">构建 Slab + 生成 POSCAR</button>
        <button id="generateSlabBtn" class="btn-primary">生成完整 VASP 输入文件</button>
      </div>
    </section>

    <section id="slabResultSection" class="result-section" style="display:none;">
      <div class="summary-box" id="slabSummaryBox"></div>
      <div class="tabs" id="slabFileTabs"></div>
      <div class="tab-content">
        <pre><code id="slabPoscarContent"></code></pre>
      </div>
      <div class="result-actions">
        <button id="copySlabBtn">复制当前内容</button>
      </div>
    </section>

    <hr class="section-divider">
    <h2>结果分析</h2>

    <section class="analysis-section">
      <p class="section-desc">上传 VASP 计算输出文件，自动提取能量、能带、收敛性、分子动力学轨迹等关键结果。</p>
      <div class="form-row">
        <div class="form-group">
          <label for="outcarFile">上传 OUTCAR 文件</label>
          <input type="file" id="outcarFile" accept=".txt,.out,outcar,OUTCAR">
          <button id="analyzeOutcarBtn" class="btn-sm">分析 OUTCAR</button>
        </div>
        <div class="form-group">
          <label for="eigenvalFile">上传 EIGENVAL 文件</label>
          <input type="file" id="eigenvalFile" accept=".txt,EIGENVAL">
          <button id="analyzeEigenBtn" class="btn-sm">分析 EIGENVAL</button>
        </div>
        <div class="form-group">
          <label for="oszicarFile">上传 OSZICAR 文件</label>
          <input type="file" id="oszicarFile" accept=".txt,OSZICAR,oszicar">
          <button id="analyzeOszicarBtn" class="btn-sm">分析 OSZICAR</button>
        </div>
        <div class="form-group">
          <label for="vasprunFile">上传 vasprun.xml</label>
          <input type="file" id="vasprunFile" accept=".xml,.txt,vasprun*">
          <button id="analyzeVasprunBtn" class="btn-sm">分析 vasprun</button>
        </div>
      </div>
      <div class="form-row" style="margin-top:0.75rem;">
        <div class="form-group">
          <label for="xdatcarFile">上传 XDATCAR</label>
          <input type="file" id="xdatcarFile" accept=".txt,XDATCAR,xdatcar">
          <button id="analyzeXdatcarBtn" class="btn-sm">分析 XDATCAR</button>
        </div>
        <div class="form-group">
          <label for="contcarFile">上传 CONTCAR</label>
          <input type="file" id="contcarFile" accept=".txt,CONTCAR,contcar">
          <button id="analyzeContcarBtn" class="btn-sm">分析 CONTCAR</button>
        </div>
      </div>

      <div id="analysisResult" class="analysis-result" style="display:none;">
        <div id="analysisSummary"></div>
      </div>
    </section>

    <section id="warningSection" class="warning-section" style="display:none;"></section>
    <section id="errorSection" class="error-section" style="display:none;"></section>
  </main>

  <details class="potcar-details" id="potcarDetails">
    <summary><span class="potcar-summary" id="potcarSummary">加载中...</span></summary>
    <div class="potcar-details-body">
      <p class="potcar-details-hint">生成输入文件时，后端会根据结构中的元素自动拼接对应的赝势文件。若库中缺少某元素的 POTCAR，生成将失败。可在此导入缺失的 POTCAR 文件。</p>
      <div class="potcar-details-row">
        <select id="potcarFunctional" class="potcar-func-select" onchange="loadPotcarStatus(this.value)">
          <option value="PBE">PBE</option>
          <option value="LDA">LDA</option>
          <option value="PW91">PW91</option>
        </select>
        <label class="potcar-import-btn">
          导入 POTCAR
          <input type="file" id="potcarFile" accept="*" multiple hidden>
        </label>
      </div>
      <div class="potcar-grid" id="potcarGrid"></div>
    </div>
  </details>
</div>

<script src="app.js"></script>
</body>
</html>
